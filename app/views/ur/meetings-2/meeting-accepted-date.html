{% extends "layouts/main.html" %}

{% set pageName="Purpose of meeting" %}

{% block beforeContent %}
<a href="javascript:window.history.back()" class="govuk-back-link">Back</a>
{% endblock %}

{% block content %}
<div class="govuk-grid-row">
  <div class="govuk-grid-column-one-half">

    <h1 class="govuk-heading-l">
      When did Sarah Phillips accept the meeting offer?
    </h1>

    <div class="govuk-form-group">

      <div class="govuk-hint" id="meeting-accepted-date-hint">
        Use the date picker or enter a date. For example, 12/08/2026
      </div>

      <div
        class="moj-datepicker"
        id="meeting-accepted-date-picker"
        data-module="moj-date-picker"
        data-excluded-days=""
      >
        <input
          type="text"
          class="govuk-input moj-js-datepicker-input"
          id="meeting-accepted-date"
          name="meetingAcceptedDate"
          autocomplete="off"
          aria-describedby="meeting-accepted-date-hint"
        >
      </div>

    </div>

    <a
      href="./log-outcome/did-meeting-happen.html"
      role="button"
      draggable="false"
      class="govuk-button"
      data-module="govuk-button"
    >
      Continue
    </a>

  

  </div>
</div>
{% endblock %}
